networks:
  docker_network_self:
    external: true
services:
  plextraktsync:
    image: ghcr.io/ac1dburnz/plextraktsync:all-in-one
    command: watch
    init: true
    shm_size: 1gb
    restart: always
    environment:
      TZ: Europe/London
      TRAKT_BROWSER_HEADLESS: "true"
      TRAKT_BROWSER_TOKEN_FILE: /app/config/browser-token.json
      LIST_BRIDGE_ENABLED: "true"
      # Register this exact redirect in your Trakt app before connecting PKCE:
      TRAKT_PKCE_CLIENT_ID: "${TRAKT_PKCE_CLIENT_ID:?Set your Trakt PKCE app Client ID}"
      TRAKT_PKCE_REDIRECT_URI: "http://192.168.1.100:8090/oauth/callback"
      TRAKT_PKCE_ALLOW_LOCAL_HTTP: "true"
      LIST_BRIDGE_SECRET: "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_24_CHARACTERS"
      LIST_BRIDGE_CACHE_SECONDS: "3600"
      SLACK_WEBHOOK_URL: ""
      # Optional poster fallback (choose one credential):
      # TMDB_API_KEY: "YOUR_TMDB_V3_API_KEY"
      # TMDB_READ_ACCESS_TOKEN: "YOUR_TMDB_READ_ACCESS_TOKEN"
      # Optional direct adds; use addresses reachable from this container:
      # RADARR_URL: "http://RADARR_HOST:7878"
      # RADARR_API_KEY: "YOUR_RADARR_API_KEY"
      # SONARR_URL: "http://SONARR_HOST:8989"
      # SONARR_API_KEY: "YOUR_SONARR_API_KEY"
    networks:
      docker_network_self:
        ipv4_address: 192.168.1.100
    ports:
      - "8090:8090"
      # For interactive login, set TRAKT_BROWSER_HEADLESS=false and enable:
      # - "6080:6080"
    volumes:
      - /mnt/YOUR_POOL/apps/plextraktsync/config:/app/config
      - /mnt/YOUR_POOL/apps/plextraktsync/browser:/browser
