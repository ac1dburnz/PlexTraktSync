name: plextraktsync-vpn-lab
services:
  trakt-vpn:
    image: ghcr.io/ac1dburnz/plextraktsync:wireguard-gateway
    pull_policy: always
    cap_add: [NET_ADMIN]
    restart: unless-stopped
    environment:
      VPN_MODE: ${VPN_MODE:-auto}
      VPN_RATE_LIMIT_FAILOVER: ${VPN_RATE_LIMIT_FAILOVER:-true}
      VPN_FAILURE_THRESHOLD: ${VPN_FAILURE_THRESHOLD:-3}
      VPN_SWITCH_COOLDOWN: ${VPN_SWITCH_COOLDOWN:-120}
      VPN_RECOVERY_INTERVAL: ${VPN_RECOVERY_INTERVAL:-900}
      VPN_HEALTH_INTERVAL: ${VPN_HEALTH_INTERVAL:-30}
    volumes:
      - ${WIREGUARD_CONFIG_PATH:?Set a WireGuard config path}:/wireguard/provider1.conf:ro
