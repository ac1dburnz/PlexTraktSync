name: WireGuard gateway image
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        required: true
        type: boolean
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: vpn-helper
          load: true
          tags: plextraktsync:gateway-test
          cache-from: type=gha,scope=wireguard-gateway
          cache-to: type=gha,scope=wireguard-gateway,mode=max
      - name: Test gateway runtime offline
        run: |
          docker run --rm --network none --entrypoint python plextraktsync:gateway-test -c 'import sys; sys.path.insert(0, "/opt/pts-vpn"); import gateway; assert gateway.INTERFACE == "ptsvpn"'
          docker run --rm --network none --entrypoint sh plextraktsync:gateway-test -ec 'wg --version; ip -Version; command -v wg-quick'
      - name: Build supported platforms
        uses: docker/build-push-action@v7
        with:
          context: vpn-helper
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ${{ steps.image.outputs.name }}:wireguard-gateway-${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=PlexTraktSync WireGuard gateway
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=wireguard-gateway
          cache-to: type=gha,scope=wireguard-gateway,mode=max
