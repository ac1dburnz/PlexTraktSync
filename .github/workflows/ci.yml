name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Serialize main releases, retaining queued merges. PR runs have their own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'release-main' }}
  cancel-in-progress: false
  queue: max
jobs:
  test:
    uses: ./.github/workflows/test.yml
  lint:
    uses: ./.github/workflows/lint.yml
  version:
    needs: [test, lint]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reserve version (or reuse on retry)
        id: version
        run: python3 scripts/release_version.py
  docker:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
  browser:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/browser-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
  release:
    needs: [version, docker, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4.6.0
        if: vars.PUBLISH_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Promote both images and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PUBLISH_DOCKERHUB: ${{ vars.PUBLISH_DOCKERHUB }}
        run: bash scripts/publish_release.sh
  automerge:
    needs: [docker, browser, test, lint]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/automerge.yml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
