name: All-in-one PlexTraktSync image
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        required: true
        type: boolean
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.all-in-one
          build-args: APP_VERSION=${{ inputs.version }}
          load: true
          tags: plextraktsync:all-in-one-test
          cache-from: type=gha,scope=browser-helper
          cache-to: type=gha,scope=browser-helper,mode=max
      - name: Test application and headless browser
        run: |
          docker run --rm --network none plextraktsync:all-in-one-test test
          docker run --rm --network none --entrypoint python plextraktsync:all-in-one-test -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.set_content("<title>browser-ok</title>"); assert page.title()=="browser-ok"; b.close(); p.stop()'
      - name: Test list bridge UI and importer URLs offline
        run: |
          docker run --rm --network none --entrypoint python -e PYTHONPATH=/app:/helper plextraktsync:all-in-one-test /helper/smoke_list_bridge.py
      - name: Test visual previews and direct adds offline
        run: |
          docker run --rm --network none --entrypoint python -e PYTHONPATH=/app:/helper plextraktsync:all-in-one-test /helper/smoke_visual_imports.py
      - name: Publish tested image
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:all-in-one-${{ inputs.version }}
          build-args: APP_VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=browser-helper
          cache-to: type=gha,scope=browser-helper,mode=max
